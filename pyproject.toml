[project]
name = "Fitlytics"
version = "0.1.0"
description = "Analyze and visualize fitness and training data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fitdecode>=0.10.0",
    "polars>=1.0.0",
    "matplotlib>=3.9.0",
    "pydantic>=2.9.0",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "deal>=4.24.0",
    "hypothesis>=6.100.0",
    "interrogate>=1.7.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitlytics"]
